name: Deploy to Azure Container App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR: acredudemocsd4bq4xx
  RESOURCE_GROUP: rg-agent-demo
  CONTAINER_APP: ca-contoso-cart
  IMAGE: contoso-cart

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: az acr build --registry "$ACR" --image "$IMAGE:${{ github.sha }}" .

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR.azurecr.io/$IMAGE:${{ github.sha }}"
