<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Agentic SDLC on Azure. Prompt to pull request to deploy, observed end to end.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c0f3a"/>
      <stop offset="0.5" stop-color="#3a1c74"/>
      <stop offset="1" stop-color="#0b3a82"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a63f4"/>
      <stop offset="1" stop-color="#33b1ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#5a3aa8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5a3aa8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t   { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; }
      .kick{ font-weight: 700; font-size: 22px; fill: #9fb4ff; letter-spacing: 6px; }
      .h1  { font-weight: 800; font-size: 92px; fill: #ffffff; letter-spacing: 0.5px; }
      .sub { font-weight: 400; font-size: 30px; fill: #d7ddff; }
      .node{ font-weight: 700; font-size: 22px; fill: #ffffff; }
      .foot{ font-weight: 600; font-size: 22px; fill: #b7c6ff; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="10" fill="url(#accent)"/>

  <!-- Microsoft mark -->
  <g transform="translate(96,88)">
    <rect x="0"  y="0"  width="26" height="26" fill="#F25022"/>
    <rect x="30" y="0"  width="26" height="26" fill="#7FBA00"/>
    <rect x="0"  y="30" width="26" height="26" fill="#00A4EF"/>
    <rect x="30" y="30" width="26" height="26" fill="#FFB900"/>
    <text x="76" y="42" class="t kick">AZURE · AI FOUNDRY · GITHUB COPILOT</text>
  </g>

  <text x="96" y="270" class="t h1">Agentic SDLC</text>
  <text x="96" y="360" class="t h1">on Azure</text>
  <text x="96" y="422" class="t sub">Prompt &#8594; pull request &#8594; live deploy — observed end to end.</text>

  <!-- pipeline -->
  <g transform="translate(96,486)">
    <rect x="60" y="30" width="1064" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>
    <g>
      <rect x="0"    y="0" width="150" height="60" rx="12" fill="#5c2d91"/>
      <text x="75"   y="38" text-anchor="middle" class="t node">Prompt</text>
    </g>
    <g>
      <rect x="228"  y="0" width="180" height="60" rx="12" fill="#6a34a6"/>
      <text x="318"  y="38" text-anchor="middle" class="t node">Foundry</text>
    </g>
    <g>
      <rect x="486"  y="0" width="180" height="60" rx="12" fill="#155a9e"/>
      <text x="576"  y="38" text-anchor="middle" class="t node">APIM</text>
    </g>
    <g>
      <rect x="744"  y="0" width="180" height="60" rx="12" fill="#0f6cbd"/>
      <text x="834"  y="38" text-anchor="middle" class="t node">Copilot</text>
    </g>
    <g>
      <rect x="1002" y="0" width="122" height="60" rx="12" fill="#33b1ff"/>
      <text x="1063" y="38" text-anchor="middle" class="t node">Deploy</text>
    </g>
  </g>

  <text x="1184" y="600" text-anchor="end" class="t foot">one operation_Id, whole trace</text>
</svg>
