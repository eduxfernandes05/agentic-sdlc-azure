<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Agentic SDLC on Azure — a natural-language request becomes a reviewed pull request and a live deployment, observed end to end.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241245"/>
      <stop offset="0.55" stop-color="#3a1c74"/>
      <stop offset="1" stop-color="#0b3a82"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a63f4"/>
      <stop offset="1" stop-color="#33b1ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .t   { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; }
      .h1  { font-weight: 800; font-size: 54px; fill: #ffffff; letter-spacing: 0.3px; }
      .sub { font-weight: 400; font-size: 21px; fill: #cfd6ff; }
      .pill{ font-weight: 600; font-size: 18px; fill: #ffffff; }
      .cap { font-weight: 600; font-size: 15px; fill: #9fb4ff; letter-spacing: 2px; }
      .node{ font-weight: 700; font-size: 16px; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#accent)"/>

  <text x="64" y="96"  class="t cap">GOVERNED · AUTONOMOUS · FULLY OBSERVABLE</text>
  <text x="60" y="158" class="t h1">Agentic SDLC on Azure</text>
  <text x="64" y="200" class="t sub">A natural-language request becomes a reviewed pull request and a live deployment.</text>

  <!-- pipeline -->
  <g filter="url(#soft)">
    <g transform="translate(64,244)">
      <!-- connective line -->
      <rect x="70" y="34" width="1000" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>

      <!-- nodes -->
      <g>
        <rect x="0"    y="8" width="150" height="56" rx="12" fill="#5c2d91"/>
        <text x="75"   y="42" text-anchor="middle" class="t node">Prompt</text>
      </g>
      <g>
        <rect x="188"  y="8" width="150" height="56" rx="12" fill="#6a34a6"/>
        <text x="263"  y="42" text-anchor="middle" class="t node">Foundry agent</text>
      </g>
      <g>
        <rect x="376"  y="8" width="150" height="56" rx="12" fill="#155a9e"/>
        <text x="451"  y="42" text-anchor="middle" class="t node">APIM gateway</text>
      </g>
      <g>
        <rect x="564"  y="8" width="150" height="56" rx="12" fill="#0f6cbd"/>
        <text x="639"  y="42" text-anchor="middle" class="t node">Copilot agent</text>
      </g>
      <g>
        <rect x="752"  y="8" width="150" height="56" rx="12" fill="#1379c4"/>
        <text x="827"  y="42" text-anchor="middle" class="t node">Pull request</text>
      </g>
      <g>
        <rect x="940"  y="8" width="150" height="56" rx="12" fill="#33b1ff"/>
        <text x="1015" y="42" text-anchor="middle" class="t node">Deploy</text>
      </g>
    </g>
  </g>

  <text x="1136" y="330" text-anchor="end" class="t cap">ONE APPLICATION INSIGHTS TRACE</text>
</svg>
