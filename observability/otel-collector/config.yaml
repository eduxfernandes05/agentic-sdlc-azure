extensions:
  # Valida o header "Authorization: Bearer <token>" que o Copilot cloud agent envia
  # via OTEL_EXPORTER_OTLP_HEADERS. Token injetado por env var (secret do Container App).
  bearertokenauth:
    token: "${env:OTEL_INGEST_TOKEN}"

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth

processors:
  batch: {}
  # Re-parent cloud agent spans into the ca-api trace. The agent carries
  # corr.trace_id / corr.span_id as resource attributes (from OTEL_RESOURCE_ATTRIBUTES,
  # injected per-task via copilot-setup-steps from the issue-body marker).
  transform/correlate:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(trace_id.string, resource.attributes["corr.trace_id"]) where resource.attributes["corr.trace_id"] != nil
          - set(parent_span_id.string, resource.attributes["corr.span_id"]) where resource.attributes["corr.span_id"] != nil and parent_span_id.string == ""

exporters:
  # Ponte para o Application Insights (insights-zj44ehcf4zlxq) via connection string.
  azuremonitor:
    connection_string: "${env:APPLICATIONINSIGHTS_CONNECTION_STRING}"
  debug:
    verbosity: normal

service:
  extensions: [bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/correlate, batch]
      exporters: [azuremonitor, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [azuremonitor]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [azuremonitor]
