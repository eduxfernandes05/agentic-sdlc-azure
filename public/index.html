<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contoso Cart</title>
  <style>
    :root { --brand: #5c2d91; --bg: #f5f5f7; --card: #fff; --line: #e5e5ea; --text: #1c1c1e; --qty: #8e8e93; }
    body.dark { --bg: #1c1c1e; --card: #2c2c2e; --line: #3a3a3c; --text: #f5f5f7; --qty: #aeaeb2; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }
    header { background: var(--brand); color: #fff; padding: 20px 24px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    header h1 { margin: 0; font-size: 20px; }
    #theme-toggle { background: rgba(255,255,255,0.2); border: none; border-radius: 8px;
      color: #fff; cursor: pointer; font-size: 14px; padding: 6px 12px; }
    .header-placeholders { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
    .placeholder-section { flex: 1; min-width: 220px; border: 1px dashed rgba(255,255,255,0.45);
      border-radius: 10px; padding: 10px 12px; }
    .placeholder-title { margin: 0 0 8px; font-size: 14px; font-weight: 700; }
    .placeholder-links { margin: 0; padding: 0; list-style: none; display: flex; gap: 10px; flex-wrap: wrap; }
    .placeholder-links a { color: rgba(255,255,255,0.92); font-size: 13px; }
    .placeholder-links a:focus-visible { outline: 2px solid rgba(255,255,255,0.9); outline-offset: 2px; border-radius: 4px; }
    main { max-width: 560px; margin: 32px auto; padding: 0 16px; }
    .card { background: var(--card); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
      overflow: hidden; }
    .row { display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: none; }
    .name { font-weight: 500; }
    .qty { color: var(--qty); font-size: 14px; }
    .totals { padding: 16px 20px; }
    .totals .row { padding: 8px 0; border: none; }
    .grand { font-size: 18px; font-weight: 700; }
    #checkout { width: 100%; margin-top: 16px; padding: 14px; border: none; border-radius: 10px;
      background: var(--brand); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    @media (max-width: 560px) {
      .header-top { flex-wrap: wrap; }
      .placeholder-section { min-width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>🛒 Contoso Cart</h1>
      <button id="theme-toggle">🌙 Night mode</button>
    </div>
    <div class="header-placeholders">
      <nav class="placeholder-section" aria-label="Menu">
        <h2 class="placeholder-title">Menu</h2>
        <ul class="placeholder-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Products</a></li>
          <li><a href="#">Support</a></li>
        </ul>
      </nav>
      <nav class="placeholder-section" aria-label="Social networks">
        <h2 class="placeholder-title">Social networks</h2>
        <ul class="placeholder-links">
          <li><a href="#">LinkedIn</a></li>
          <li><a href="#">X</a></li>
          <li><a href="#">Instagram</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main>
    <div class="card">
      <div id="items"></div>
      <div class="totals">
        <div class="row"><span>Subtotal</span><span id="subtotal">—</span></div>
        <div class="row grand"><span>Total</span><span id="total">—</span></div>
      </div>
    </div>
    <button id="checkout">Checkout</button>
  </main>
  <script>
    const money = (n) => "$" + Number(n).toFixed(2);
    fetch("/api/cart").then((r) => r.json()).then((data) => {
      document.getElementById("items").innerHTML = data.items.map((i) =>
        `<div class="row"><span class="name">${i.name} <span class="qty">×${i.quantity}</span></span>`
        + `<span>${money(i.price * i.quantity)}</span></div>`).join("");
      document.getElementById("subtotal").textContent = money(data.subtotal);
      document.getElementById("total").textContent = money(data.subtotal);
    });
    document.getElementById("checkout").addEventListener("click", () => alert("Order placed!"));

    const toggle = document.getElementById("theme-toggle");
    function applyTheme(dark) {
      document.body.classList.toggle("dark", dark);
      toggle.textContent = dark ? "☀️ Light mode" : "🌙 Night mode";
    }
    applyTheme(localStorage.getItem("theme") === "dark");
    toggle.addEventListener("click", () => {
      const dark = !document.body.classList.contains("dark");
      localStorage.setItem("theme", dark ? "dark" : "light");
      applyTheme(dark);
    });
  </script>
</body>
</html>
