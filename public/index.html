<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contoso Cart Simulator</title>
  <style>
    :root { --brand: #5c2d91; --bg: #f5f5f7; --card: #fff; --line: #e5e5ea; --text: #1c1c1e; --qty: #8e8e93; }
    body.dark { --bg: #1c1c1e; --card: #2c2c2e; --line: #3a3a3c; --text: #f5f5f7; --qty: #aeaeb2; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }
    header { background: var(--brand); color: #fff; padding: 20px 24px;
      display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 20px; }
    #theme-toggle { background: rgba(255,255,255,0.2); border: none; border-radius: 8px;
      color: #fff; cursor: pointer; font-size: 14px; padding: 6px 12px; }
    main { max-width: 560px; margin: 32px auto; padding: 0 16px; }
    .card { background: var(--card); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
      overflow: hidden; }
    .row { display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: none; }
    .name { font-weight: 500; }
    .qty { color: var(--qty); font-size: 14px; }
    .totals { padding: 16px 20px; }
    .totals .row { padding: 8px 0; border: none; }
    .grand { font-size: 18px; font-weight: 700; }
    .discount-row { color: #2e8b57; }
    #voucher-section { padding: 16px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
    #voucher-input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); color: var(--text); font-size: 14px; }
    #voucher-btn { padding: 10px 16px; border: none; border-radius: 8px;
      background: var(--brand); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    #voucher-msg { padding: 4px 20px 12px; font-size: 13px; }
    #voucher-msg.ok { color: #2e8b57; }
    #voucher-msg.err { color: #c0392b; }
    #checkout { width: 100%; margin-top: 16px; padding: 14px; border: none; border-radius: 10px;
      background: var(--brand); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    #settings-btn { position: fixed; bottom: 24px; right: 24px; width: 48px; height: 48px;
      border-radius: 50%; border: none; background: var(--brand); color: #fff;
      font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.25); z-index: 100; }
    #settings-btn:hover { opacity: 0.85; }
    #settings-panel { display: none; position: fixed; bottom: 84px; right: 24px;
      background: var(--card); border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.18);
      padding: 20px 24px; min-width: 200px; z-index: 99; color: var(--text); }
    #settings-panel.open { display: block; }
    #settings-panel h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
    #settings-panel label { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>🛒 Contoso Cart Simulator</h1>
    <button id="theme-toggle">🌙 Night mode</button>
  </header>
  <main>
    <div class="card">
      <div id="items"></div>
      <div id="voucher-section">
        <input id="voucher-input" type="text" placeholder="Voucher code (e.g. SAVE10)" />
        <button id="voucher-btn">Apply</button>
      </div>
      <div id="voucher-msg"></div>
      <div class="totals">
        <div class="row"><span>Subtotal</span><span id="subtotal">—</span></div>
        <div class="row discount-row" id="discount-row" style="display:none">
          <span>Discount (10%)</span><span id="discount">—</span>
        </div>
        <div class="row grand"><span>Total</span><span id="total">—</span></div>
      </div>
    </div>
    <button id="checkout">Checkout</button>
  </main>
  <button id="settings-btn" aria-label="Settings">⚙️</button>
  <div id="settings-panel" role="dialog" aria-label="Settings panel">
    <h2>Settings</h2>
    <label><input type="checkbox" id="settings-darkmode" /> Dark mode</label>
  </div>
  <script>
    const money = (n) => "$" + Number(n).toFixed(2);
    let subtotalValue = 0;

    fetch("/api/cart").then((r) => r.json()).then((data) => {
      subtotalValue = data.subtotal;
      document.getElementById("items").innerHTML = data.items.map((i) =>
        `<div class="row"><span class="name">${i.name} <span class="qty">×${i.quantity}</span></span>`
        + `<span>${money(i.price * i.quantity)}</span></div>`).join("");
      document.getElementById("subtotal").textContent = money(data.subtotal);
      document.getElementById("total").textContent = money(data.subtotal);
    });

    document.getElementById("voucher-btn").addEventListener("click", () => {
      const code = document.getElementById("voucher-input").value.trim();
      const msg = document.getElementById("voucher-msg");
      fetch("/api/voucher", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code }),
      }).then((r) => r.json()).then((data) => {
        if (data.valid) {
          document.getElementById("discount-row").style.display = "";
          document.getElementById("discount").textContent = "-" + money(data.discount);
          document.getElementById("total").textContent = money(data.total);
          msg.textContent = "✅ Voucher applied — 10% off!";
          msg.className = "ok";
        } else {
          document.getElementById("discount-row").style.display = "none";
          document.getElementById("total").textContent = money(subtotalValue);
          msg.textContent = "❌ Invalid voucher code.";
          msg.className = "err";
        }
      });
    });

    document.getElementById("checkout").addEventListener("click", () => alert("Order placed!"));

    const toggle = document.getElementById("theme-toggle");
    function applyTheme(dark) {
      document.body.classList.toggle("dark", dark);
      toggle.textContent = dark ? "☀️ Light mode" : "🌙 Night mode";
    }
    applyTheme(localStorage.getItem("theme") === "dark");
    function setTheme(dark) {
      localStorage.setItem("theme", dark ? "dark" : "light");
      applyTheme(dark);
      settingsDarkmode.checked = dark;
    }
    toggle.addEventListener("click", () => setTheme(!document.body.classList.contains("dark")));

    const settingsBtn = document.getElementById("settings-btn");
    const settingsPanel = document.getElementById("settings-panel");
    const settingsDarkmode = document.getElementById("settings-darkmode");
    settingsDarkmode.checked = localStorage.getItem("theme") === "dark";
    settingsBtn.addEventListener("click", () => {
      settingsPanel.classList.toggle("open");
    });
    settingsDarkmode.addEventListener("change", () => setTheme(settingsDarkmode.checked));
    document.addEventListener("click", (e) => {
      if (!settingsPanel.contains(e.target) && e.target !== settingsBtn) {
        settingsPanel.classList.remove("open");
      }
    });
  </script>
</body>
</html>
